name: ARCES CI

on:
  push:
    branches:
      - main
      - ci/build-and-tests
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build-and-test:
    name: Windows build and test
    runs-on: windows-2022
    timeout-minutes: 60

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out ARCES
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pinned vcpkg
        run: |
          $vcpkgCommit = (Get-Content vcpkg-commit.txt -Raw).Trim()
          if ($vcpkgCommit -notmatch '^[0-9a-f]{40}$') {
            throw "Invalid vcpkg commit."
          }

          $vcpkgRoot = Join-Path $env:RUNNER_TEMP "arces-vcpkg"

          git clone https://github.com/microsoft/vcpkg.git "$vcpkgRoot"
          if ($LASTEXITCODE -ne 0) { throw "vcpkg clone failed." }

          git -C "$vcpkgRoot" checkout --detach "$vcpkgCommit"
          if ($LASTEXITCODE -ne 0) { throw "vcpkg checkout failed." }

          & "$vcpkgRoot/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap failed." }

          "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV

      - name: Configure
        run: |
          cmake --preset windows-static

      - name: Build
        run: cmake --build --preset static-debug --parallel

      - name: Test
        run: ctest --preset static-debug

      - name: Build Release
        run: cmake --build --preset static-release --parallel

      - name: Test Release
        run: ctest --preset static-release
